<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip Race - Poker & Events</title>
    <meta name="debug-id" content="84af30b9-50c4-4d9c-87b9-26a2c84b2c32" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00E0FF",
                        secondary: "#0F52BA",
                        accent: "#00A2FF",
                        "background-light": "#F3F4F6",
                        "background-dark": "#0A0F1A",
                        "surface-dark": "#131C31",
                    },
                    fontFamily: {
                        display: ["Orbitron", "sans-serif"],
                        body: ["Rajdhani", "sans-serif"],
                    },
                    backgroundImage: {
                        'hero-glow': "radial-gradient(circle at 50% 50%, rgba(0, 224, 255, 0.15), rgba(5, 8, 20, 0) 70%)",
                        'card-gradient': "linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%)",
                    },
                    boxShadow: {
                        'neon-pink': '0 0 20px rgba(0, 224, 255, 0.5)',
                        'neon-blue': '0 0 20px rgba(0, 224, 255, 0.5)',
                    }
                },
            },
        };
    </script>

    <!-- Custom CSS for specific effects -->
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }

        #root {
            width: 100%;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #050214;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(0, 224, 255, 0.5);
        }

        .text-glow-blue {
            text-shadow: 0 0 10px rgba(0, 224, 255, 0.5);
        }

        /* NEW SHIMMER AND RANK COLORS */
        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .title-shimmer {
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .bar-shimmer {
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
        }

        .text-shadow-cyan {
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        .text-shadow-gold {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .text-shadow-purple {
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .text-shadow-green {
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }

        .text-shadow-red {
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* Gradient mask for the hero image if needed */
        .mask-image-gradient {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        .form-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #00E0FF;
        }

        /* Hide numeric input spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* CELESTIAL AURA FOR PATRAO BADGE */
        @keyframes celestial-pulse {
            0% { 
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px rgba(0, 224, 255, 0.2); 
                border-color: rgba(255, 255, 255, 0.8);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(0, 224, 255, 0.6); 
                border-color: rgba(255, 255, 255, 1);
                transform: scale(1.02);
            }
            100% { 
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px rgba(0, 224, 255, 0.2); 
                border-color: rgba(255, 255, 255, 0.8);
                transform: scale(1);
            }
        }

        .badge-patrao-aura {
            animation: celestial-pulse 2.5s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(0,224,255,0.05)) !important;
            border-width: 3px !important;
            z-index: 1;
        }

        /* SUPREME AURA */
        @keyframes supreme-pulse {
            0% { box-shadow: 0 0 8px rgba(236, 72, 153, 0.3), 0 0 15px rgba(234, 88, 12, 0.1); border-color: rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 18px rgba(236, 72, 153, 0.6), 0 0 30px rgba(234, 88, 12, 0.4); border-color: rgba(236, 72, 153, 0.8); }
            100% { box-shadow: 0 0 8px rgba(236, 72, 153, 0.3), 0 0 15px rgba(234, 88, 12, 0.1); border-color: rgba(236, 72, 153, 0.4); }
        }

        .badge-supreme-aura {
            animation: supreme-pulse 3s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(236,72,153,0.1), rgba(234,88,12,0.05)) !important;
            border-width: 2px !important;
        }

        /* LEGENDARY AURA - Intensified with glow */
        @keyframes legendary-pulse {
            0% { 
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2); 
                border-color: rgba(255, 215, 0, 0.5); 
            }
            50% { 
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 45px rgba(255, 215, 0, 0.5); 
                border-color: rgba(255, 215, 0, 1); 
            }
            100% { 
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2); 
                border-color: rgba(255, 215, 0, 0.5); 
            }
        }

        .badge-legendary-aura {
            animation: legendary-pulse 3.5s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,255,255,0.08)) !important;
            border-width: 2px !important;
            position: relative;
        }

        .badge-legendary-aura::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0.5;
        }

        /* CELESTIAL AURA */
        @keyframes celestial-shimmer {
            0% { box-shadow: 0 0 15px rgba(255, 255, 240, 0.4); border-color: rgba(255, 255, 240, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 255, 240, 0.8), 0 0 50px rgba(0, 224, 255, 0.2); border-color: rgba(255, 255, 240, 0.9); }
            100% { box-shadow: 0 0 15px rgba(255, 255, 240, 0.4); border-color: rgba(255, 255, 240, 0.5); }
        }

        .badge-celestial-aura {
            animation: celestial-shimmer 4s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(255,255,240,0.2), rgba(255,255,255,0.1)) !important;
            border-width: 2.5px !important;
        }

        /* EPIC AURA */
        @keyframes epic-pulse {
            0% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); border-color: rgba(239, 68, 68, 0.8); }
            100% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.4); }
        }

        .badge-epic-aura {
            animation: epic-pulse 3s infinite ease-in-out;
            background: rgba(239, 68, 68, 0.05) !important;
            border-width: 1.5px !important;
        }

        /* RARE AURA */
        @keyframes rare-pulse {
            0% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); border-color: rgba(0, 229, 255, 0.4); }
            50% { box-shadow: 0 0 18px rgba(0, 229, 255, 0.6); border-color: rgba(0, 229, 255, 0.8); }
            100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); border-color: rgba(0, 229, 255, 0.4); }
        }

        .badge-rare-aura {
            animation: rare-pulse 3s infinite ease-in-out;
            background: rgba(0, 229, 255, 0.05) !important;
            border-width: 1.5px !important;
        }

        /* UNCOMMON AURA */
        @keyframes uncommon-pulse {
            0% { box-shadow: 0 0 5px rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.3); }
            50% { box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); border-color: rgba(34, 197, 94, 0.6); }
            100% { box-shadow: 0 0 5px rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.3); }
        }

        .badge-uncommon-aura {
            animation: uncommon-pulse 4s infinite ease-in-out;
            border-width: 1px !important;
        }
    </style>

{

</script>

<body
    class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 font-body antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        // Prevent mouse wheel from changing values in number inputs
        document.addEventListener('wheel', function (event) {
            if (document.activeElement.type === 'number') {
                document.activeElement.blur();
            }
        });
    </script>
</body>

</html>
